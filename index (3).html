<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Will you be my Valentine?</h1>
        <img src="https://unsplash.com/photos/a-plate-of-heart-shaped-marshmallows-next-to-a-rose-k_GBb-vQP2s" alt="Heart Image" class="heart-img">
        <p class="message">This Valentine's Day, I want to ask someone special...</p>
        <button class="yes-btn" onclick="answer('yes')">Yes, I will!</button>
        <button class="no-btn" onclick="answer('no')">No, sorry!</button>
        <div id="response"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
